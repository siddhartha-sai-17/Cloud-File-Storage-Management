services:
  # Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: cloud_storage_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloud_storage
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloud_storage_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # MinIO Object Storage Service
  minio:
    image: minio/minio
    container_name: cloud_storage_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - cloud_storage_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis Caching Service
  redis:
    image: redis:7.0-alpine
    container_name: cloud_storage_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - cloud_storage_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M

  # RabbitMQ Messaging Service
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: cloud_storage_rabbitmq
    restart: always
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      - cloud_storage_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 256M

  # Backend Service (Spring Boot)
  backend:
    build: ./backend
    container_name: cloud_storage_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: cloud-files
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_SECRET: ProductionSecureSecretKeyWithAtLeast256BitsOfEntropy!ProductionSecureSecretKeyWithAtLeast256BitsOfEntropy!
    volumes:
      - backend_logs:/app/logs
    networks:
      - cloud_storage_network
    depends_on:
      - db
      - minio
      - redis
      - rabbitmq
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 768M

  # Frontend Service (Nginx React Static Serve)
  frontend:
    build: ./frontend
    container_name: cloud_storage_frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - cloud_storage_network
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  db_data:
  minio_data:
  redis_data:
  rabbit_data:
  backend_logs:

networks:
  cloud_storage_network:
    driver: bridge
