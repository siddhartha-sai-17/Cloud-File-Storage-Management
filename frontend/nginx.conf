server {
    listen 80;
    server_name _;

    # Enable Gzip compression for common file types
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # Root for the SPA static build output
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"            always;
    add_header X-Content-Type-Options     "nosniff"               always;
    add_header X-XSS-Protection           "1; mode=block"         always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
    # Uncomment and configure CSP for your domain before going to production:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com;" always;
    # Uncomment HSTS only after SSL is confirmed working:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Client-Side Route Fallback (SPA) ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Long-term Caching for Hashed Static Assets ─────────────────────────────
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # ─── Service Worker & Manifest ───────────────────────────────────────────────
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── API Reverse Proxy to Backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Large upload support (max 10 GB body)
        client_max_body_size 10g;
        client_body_timeout  600s;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_connect_timeout 60s;

        # Disable response buffering for streaming/SSE endpoints
        proxy_buffering off;
    }

    # ─── WebSocket Reverse Proxy ─────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Actuator / Health (internal only — remove proxy_pass if not needed) ────
    location /actuator/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
        proxy_read_timeout 30s;
    }

    # ─── Error Pages ─────────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
