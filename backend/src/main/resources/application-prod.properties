# Production Profile Configurations

# Database Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}

# Hikari Connection Pool Size
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:10}

# MinIO Settings
minio.url=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:user-files-prod}

# JWT Settings
jwt.secret=${JWT_SECRET:ProductionSecureSecretKeyWithAtLeast256BitsOfEntropy!ProductionSecureSecretKeyWithAtLeast256BitsOfEntropy!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000} # 10 hours

# Redis Settings (Production caching integration)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ Settings (Production messaging integration)
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}

# Logging levels
logging.level.org.hibernate.SQL=ERROR
logging.level.com.cloudstorage.backend=INFO

# Rate Limit Config
rate-limit.limit=${RATE_LIMIT_LIMIT:100}

# Actuator Security & Endpoint Mapping
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
