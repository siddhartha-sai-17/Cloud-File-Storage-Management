# Developer Profile Configurations

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.cloudstorage.backend=DEBUG

# Rate Limit Config
rate-limit.limit=1000

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
