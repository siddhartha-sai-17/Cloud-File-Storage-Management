# Testing Profile Configurations

# Database - memory db or separate test schema
spring.datasource.url=jdbc:mysql://localhost:3306/cloud_storage_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
