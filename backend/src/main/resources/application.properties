spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
# Database Configuration
# Defaults to localhost (for local setup) but overrideable by Env Vars (for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cloud_storage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# MinIO Configuration
minio.url=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:user-files}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Enterprise Upload Settings
upload.default-chunk-size=5242880
upload.min-chunk-size=262144
upload.max-chunk-size=52428800
upload.max-file-size=2147483648
upload.session-expiration-hours=24

# Retry Configuration
upload.retry.enabled=true
upload.retry.max-attempts=5
upload.retry.initial-delay-ms=1000
upload.retry.multiplier=2
upload.retry.max-delay-ms=30000
upload.retry.jitter=true

# Parallel Upload Configuration
upload.parallel.enabled=true
upload.parallel.max-workers=16
upload.parallel.max-chunks-per-session=8
upload.parallel.executor-queue=500

# Upload Queue & Priority Scheduling
upload.queue.enabled=true
upload.queue.max-size=1000
upload.queue.default-priority=NORMAL
upload.queue.high-priority-slots=4
upload.queue.normal-priority-slots=8
upload.queue.low-priority-slots=4
upload.queue.starvation-threshold-ms=30000

# Upload Progress Tracking Config
upload.progress.enabled=true
upload.progress.broadcast-interval-ms=500
upload.progress.db-update-interval-ms=1000
upload.progress.websocket.enabled=true
upload.progress.max-subscribers=5000

# Upload History & Audit Retention
upload.audit.retention-days=30
upload.history.retention-days=90
upload.audit.cleanup-cron=0 0 2 * * ?

# Hikari Connection Pool Size
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000

# Performance Optimizations
upload.performance.buffer-size=65536
upload.performance.buffer-pool-size=256
upload.performance.batch-size=100
upload.performance.enable-buffer-pooling=true
upload.performance.enable-streaming=true
upload.performance.enable-batching=true
upload.performance.enable-filechannel=true
upload.performance.enable-zero-copy=false
upload.performance.executor-core-size=16
upload.performance.executor-max-size=64
upload.performance.executor-queue=5000

# Search Engine Configurations
search.enabled=true
search.max-results=100
search.default-page-size=20
search.highlight.enabled=true
search.snippet.length=200
search.cache.enabled=true
search.cache.max-size=10000
search.cache.expire-minutes=10

# OCR Subsystem Configurations
ocr.enabled=true
ocr.executor.core-size=4
ocr.executor.max-size=16
ocr.queue-capacity=500
ocr.max-file-size=100MB
ocr.supported-types=pdf,png,jpg,jpeg,tiff,bmp
ocr.retry.max-attempts=3
ocr.retry.delay-ms=5000

# Workspace & RBAC Configurations
workspace.personal.default-quota-bytes=10737418240
workspace.personal.name-template={username}'s Personal Workspace
workspace.invitation.expiry-hours=72
workspace.auth.cache-ttl-minutes=5
workspace.cleanup.expired-invitations-cron=0 0 3 * * ?
workspace.cleanup.expired-sessions-cron=0 30 2 * * ?

# Rate Limiting
rate-limit.limit=1000
